                                                        {acc.mp && `MP +${acc.mp}`}
                                                        {acc.speed && `SPD +${acc.speed}`}
                                                    </p>
                                                    <p className="text-yellow-400 mt-1">💰 {acc.price} Or</p>
                                                </div>
                                                <button
                                                    onClick={() => buyEquipment('accessory', key)}
                                                    className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition-all"
                                                    disabled={player.gold < acc.price || equipment.accessory === key}
                                                >
                                                    {equipment.accessory === key ? 'Équipé' : 'Acheter'}
                                                </button>
                                            </div>
                                        ))}
                                </div>
                            </div>

                            {battleLog.length > 0 && (
                                <div className="bg-gray-900 rounded-lg p-4 mb-4 max-h-32 overflow-y-auto">
                                    {battleLog.slice(-5).map(log => (
                                        <p key={log.id} className={`text-sm ${
                                            log.type === 'success' ? 'text-green-400' :
                                            log.type === 'danger' ? 'text-red-400' :
                                            log.type === 'warning' ? 'text-yellow-400' :
                                            'text-gray-400'
                                        }`}>
                                            {log.message}
                                        </p>
                                    ))}
                                </div>
                            )}

                            <button
                                onClick={() => {
                                    setGameState(GAME_STATES.EXPLORATION);
                                    setBattleLog([]);
                                }}
                                className="w-full px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-all"
                            >
                                Partir
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState === GAME_STATES.COMBAT) {
                const skills = getAvailableSkills();

                return (
                    <div className="min-h-screen bg-gradient-to-b from-red-900 via-gray-900 to-black">
                        <StatsBar />
                        <div className="max-w-6xl mx-auto p-6">
                            {/* Ennemi */}
                            <div className="bg-gray-800 rounded-lg p-6 mb-6 border-4 border-red-500 fade-in">
                                <div className="text-center mb-4">
                                    <h2 className="text-3xl font-bold text-red-400 mb-2">
                                        {combat.enemy.name}
                                        {combat.enemy.boss && <span className="ml-2 text-yellow-400">👑 BOSS</span>}
                                    </h2>
                                    <div className="flex items-center justify-center gap-2 mb-2">
                                        <span className="text-gray-400">HP</span>
                                        <div className="w-96 bg-gray-700 rounded-full h-6 overflow-hidden">
                                            <div
                                                className="hp-bar bg-gradient-to-r from-red-600 to-red-400 h-full transition-all"
                                                style={{ width: `${(combat.enemy.currentHp / combat.enemy.maxHp) * 100}%` }}
                                            />
                                        </div>
                                        <span className="text-white">{combat.enemy.currentHp}/{combat.enemy.maxHp}</span>
                                    </div>
                                    <div className="text-gray-400 text-sm space-x-4">
                                        <span>⚔️ {combat.enemy.attack}</span>
                                        <span>🛡️ {combat.enemy.defense}</span>
                                        <span>⚡ {combat.enemy.speed}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Log de combat */}
                            <div className="bg-gray-900 rounded-lg p-4 mb-6 h-40 overflow-y-auto border-2 border-gray-700">
                                <h3 className="text-lg font-bold text-gray-400 mb-2">📜 Combat</h3>
                                {battleLog.map(log => (
                                    <p key={log.id} className={`text-sm mb-1 ${
                                        log.type === 'success' ? 'text-green-400' :
                                        log.type === 'danger' ? 'text-red-400' :
                                        log.type === 'warning' ? 'text-yellow-400' :
                                        'text-gray-400'
                                    }`}>
                                        • {log.message}
                                    </p>
                                ))}
                            </div>

                            {/* Actions */}
                            <div className="grid grid-cols-2 gap-4">
                                {/* Compétences */}
                                <div className="bg-gray-800 rounded-lg p-4 border-2 border-blue-500">
                                    <h3 className="text-xl font-bold text-blue-300 mb-3">⚔️ Compétences</h3>
                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        {skills.map(skill => {
                                            const canUse = player.currentMp >= skill.mpCost;
                                            return (
                                                <button
                                                    key={skill.id}
                                                    onClick={() => playerAction({ type: 'skill', skill })}
                                                    disabled={!canUse}
                                                    className={`w-full text-left p-3 rounded-lg transition-all ${
                                                        canUse
                                                            ? 'bg-blue-900 hover:bg-blue-800 border-2 border-blue-600'
                                                            : 'bg-gray-900 border-2 border-gray-700 opacity-50 cursor-not-allowed'
                                                    }`}
                                                >
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-white font-bold">{skill.name}</span>
                                                        <span className="text-blue-400">{skill.mpCost} MP</span>
                                                    </div>
                                                    <p className="text-gray-400 text-sm">{skill.description}</p>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Objets & Actions */}
                                <div>
                                    <div className="bg-gray-800 rounded-lg p-4 border-2 border-green-500 mb-4">
                                        <h3 className="text-xl font-bold text-green-300 mb-3">🎒 Objets</h3>
                                        <div className="space-y-2 max-h-64 overflow-y-auto">
                                            {Object.entries(inventory)
                                                .filter(([key, qty]) => qty > 0 && ITEMS[key].effect !== 'revive')
                                                .length === 0 ? (
                                                <p className="text-gray-500 text-sm">Aucun objet utilisable</p>
                                            ) : (
                                                Object.entries(inventory)
                                                    .filter(([key, qty]) => qty > 0 && ITEMS[key].effect !== 'revive')
                                                    .map(([key, qty]) => {
                                                        const item = ITEMS[key];
                                                        return (
                                                            <button
                                                                key={key}
                                                                onClick={() => playerAction({ type: 'item', itemKey: key })}
                                                                className="w-full text-left p-3 rounded-lg bg-green-900 hover:bg-green-800 border-2 border-green-600 transition-all"
                                                            >
                                                                <div className="flex justify-between items-center">
                                                                    <span className="text-white font-bold">{item.name}</span>
                                                                    <span className="text-gray-400">x{qty}</span>
                                                                </div>
                                                                <p className="text-gray-400 text-sm">{item.description}</p>
                                                            </button>
                                                        );
                                                    })
                                            )}
                                        </div>
                                    </div>

                                    {/* Fuir */}
                                    {!combat.enemy.boss && (
                                        <button
                                            onClick={() => playerAction({ type: 'flee' })}
                                            className="w-full px-6 py-3 bg-yellow-700 hover:bg-yellow-600 text-white font-bold rounded-lg transition-all"
                                        >
                                            🏃 Fuir
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Statuts actifs */}
                            {(combat.playerDefending || combat.playerFocused) && (
                                <div className="mt-4 bg-blue-900 border-2 border-blue-500 rounded-lg p-3">
                                    <p className="text-blue-200 font-bold">
                                        Statuts actifs :
                                        {combat.playerDefending && <span className="ml-2">🛡️ Défense</span>}
                                        {combat.playerFocused && <span className="ml-2">✨ Concentration</span>}
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return null;
        }

        // Rendu de l'application
        ReactDOM.render(<DungeonRPG />, document.getElementById('root'));
    </script>
</body>
</html>
