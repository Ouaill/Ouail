        function calculateDerivedStats(attributes, level, playerClass, race) {
            const classData = CLASSES[playerClass];
            const raceData = RACES[race];

            const maxHp = 50 + (attributes.end * 5) + (level * 10) + classData.hpBonus;
            const maxMana = (20 + (attributes.int * 3) + (level * 5) + classData.manaBonus) * (raceData.manaBonus || 1);

            return {
                maxHp: Math.floor(maxHp),
                maxMana: Math.floor(maxMana),
                meleeDamage: 5 + Math.floor(attributes.str / 2),
                magicPower: 5 + Math.floor(attributes.int / 2),
                armor: Math.floor(attributes.end / 3),
                dodge: attributes.agi * 2,
                critChance: 5 + attributes.per,
                critDamage: 150 + attributes.per * 2,
                carryCapacity: 50 + attributes.str * 5,
                trapDetection: attributes.per * 3,
                secretDetection: attributes.per * 2,
            };
        }

        function physicalAttack(attacker, defender, weapon) {
            const dodgeRoll = Math.random() * 100;
            if (dodgeRoll < defender.dodge) {
                return { hit: false, message: 'Esquivé!' };
            }

            const weaponData = WEAPONS[weapon] || WEAPONS.fist;
            let damage = attacker.meleeDamage + (weaponData.damage[0] + Math.random() * (weaponData.damage[1] - weaponData.damage[0]));

            damage *= (0.8 + Math.random() * 0.4);

            const critRoll = Math.random() * 100;
            const isCritical = critRoll < attacker.critChance;
            if (isCritical) damage *= (attacker.critDamage / 100);

            const reduction = defender.armor / (defender.armor + 50);
            damage *= (1 - reduction);

            return {
                hit: true,
                damage: Math.max(1, Math.floor(damage)),
                critical: isCritical,
            };
        }

        function magicAttack(caster, target, spell) {
            const spellData = SPELLS[spell];
            if (!spellData) return { success: false, reason: 'Sort inconnu' };
            if (caster.currentMana < spellData.manaCost) return { success: false, reason: 'Pas assez de mana' };

            let damage = 0;
            let healing = 0;

            if (spellData.damage) {
                damage = caster.magicPower + spellData.damage;
                const magicResist = target.wis / (target.wis + 30);
                damage *= (1 - magicResist * 0.5);
            }

            if (spellData.healing) {
                healing = spellData.healing + caster.wis;
            }

            return {
                success: true,
                damage: Math.floor(damage),
                healing: Math.floor(healing),
                effect: spellData.effect || spellData.buff || spellData.debuff,
                manaCost: spellData.manaCost,
            };
        }

        // ==================== GÉNÉRATION DE DONJON ====================

        class DungeonGenerator {
            constructor(width, height, config) {
                this.width = width;
                this.height = height;
                this.config = config;
                this.grid = Array(height).fill().map(() => Array(width).fill(TILE_TYPES.VOID));
                this.rooms = [];
            }

            generate() {
                this.createRooms();
                this.connectRooms();
                this.placeStairs();
                this.placeEntities();
                return {
                    grid: this.grid,
                    rooms: this.rooms,
                    spawn: this.rooms[0] ? this.rooms[0].center : { x: 5, y: 5 },
                };
            }

            createRooms() {
                const attempts = 50;
                const minSize = 4;
                const maxSize = 10;

                for (let i = 0; i < attempts && this.rooms.length < 8; i++) {
                    const w = minSize + Math.floor(Math.random() * (maxSize - minSize));
                    const h = minSize + Math.floor(Math.random() * (maxSize - minSize));
                    const x = 2 + Math.floor(Math.random() * (this.width - w - 4));
                    const y = 2 + Math.floor(Math.random() * (this.height - h - 4));

                    const newRoom = { x, y, w, h, center: { x: x + Math.floor(w/2), y: y + Math.floor(h/2) } };

                    let overlaps = false;
                    for (const room of this.rooms) {
                        if (this.roomsOverlap(newRoom, room)) {
                            overlaps = true;
                            break;
                        }
                    }

                    if (!overlaps) {
                        this.carveRoom(newRoom);
                        this.rooms.push(newRoom);
                    }
                }
            }

            roomsOverlap(room1, room2) {
                return !(room1.x + room1.w + 1 < room2.x ||
                        room2.x + room2.w + 1 < room1.x ||
                        room1.y + room1.h + 1 < room2.y ||
                        room2.y + room2.h + 1 < room1.y);
            }

            carveRoom(room) {
                for (let y = room.y; y < room.y + room.h; y++) {
                    for (let x = room.x; x < room.x + room.w; x++) {
                        if (x >= 0 && x < this.width && y >= 0 && y < this.height) {
                            this.grid[y][x] = TILE_TYPES.FLOOR;
                        }
                    }
                }
            }

            connectRooms() {
                for (let i = 0; i < this.rooms.length - 1; i++) {
                    const roomA = this.rooms[i];
                    const roomB = this.rooms[i + 1];
                    this.carveCorridor(roomA.center, roomB.center);
                }
            }

            carveCorridor(start, end) {
                let x = start.x;
                let y = start.y;

                while (x !== end.x) {
                    if (x >= 0 && x < this.width && y >= 0 && y < this.height) {
                        if (this.grid[y][x] === TILE_TYPES.VOID) {
                            this.grid[y][x] = TILE_TYPES.FLOOR;
                        }
                    }
                    x += x < end.x ? 1 : -1;
                }

                while (y !== end.y) {
                    if (x >= 0 && x < this.width && y >= 0 && y < this.height) {
                        if (this.grid[y][x] === TILE_TYPES.VOID) {
                            this.grid[y][x] = TILE_TYPES.FLOOR;
                        }
                    }
                    y += y < end.y ? 1 : -1;
                }
            }

            placeStairs() {
                if (this.rooms.length > 0) {
                    const lastRoom = this.rooms[this.rooms.length - 1];
                    this.grid[lastRoom.center.y][lastRoom.center.x] = TILE_TYPES.STAIRS_DOWN;
                }
            }

            }
        }

        // ==================== MOTEUR RAYCASTING ====================

        class RaycastEngine {
            constructor(canvas, config) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.config = config;
                this.canvas.width = config.screenWidth;
                this.canvas.height = config.screenHeight;
            }

            render(player, dungeon, entities) {
                this.ctx.fillStyle = '#1a1a2e';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.drawFloor();
                this.drawCeiling();
                this.castRays(player, dungeon);
                this.drawEntities(player, entities);
            }

            drawFloor() {
                const gradient = this.ctx.createLinearGradient(0, this.canvas.height / 2, 0, this.canvas.height);
                gradient.addColorStop(0, '#2a2a3e');
                gradient.addColorStop(1, '#1a1a2e');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, this.canvas.height / 2, this.canvas.width, this.canvas.height / 2);
            }

            drawCeiling() {
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height / 2);
                gradient.addColorStop(0, '#0a0a1e');
                gradient.addColorStop(1, '#1a1a2e');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height / 2);
            }

            castRays(player, dungeon) {
                const fovRad = (this.config.fov * Math.PI) / 180;
                const angleStep = fovRad / this.config.rayCount;
                const columnWidth = this.canvas.width / this.config.rayCount;

                for (let i = 0; i < this.config.rayCount; i++) {
                    const rayAngle = player.angle - fovRad / 2 + angleStep * i;
                    const ray = this.castRay(player.x, player.y, rayAngle, dungeon);

                    if (ray.hit) {
                        const correctedDistance = ray.distance * Math.cos(rayAngle - player.angle);
                        const wallHeight = (this.canvas.height / correctedDistance) * 2;

                        const brightness = Math.max(0, 1 - ray.distance / this.config.maxRenderDistance);
                        const color = this.getWallColor(ray.tileType, brightness);

                        this.ctx.fillStyle = color;
                        this.ctx.fillRect(
                            i * columnWidth,
                            (this.canvas.height - wallHeight) / 2,
                            columnWidth + 1,
                            wallHeight
                        );
                    }
                }
            }

            castRay(startX, startY, angle, dungeon) {
                const dirX = Math.cos(angle);
                const dirY = Math.sin(angle);
                const deltaDistX = Math.abs(1 / dirX);
                const deltaDistY = Math.abs(1 / dirY);

                let mapX = Math.floor(startX);
                let mapY = Math.floor(startY);

                let stepX = dirX > 0 ? 1 : -1;
                let stepY = dirY > 0 ? 1 : -1;

                let sideDistX = dirX > 0 ? (mapX + 1 - startX) * deltaDistX : (startX - mapX) * deltaDistX;
                let sideDistY = dirY > 0 ? (mapY + 1 - startY) * deltaDistY : (startY - mapY) * deltaDistY;

                let hit = false;
                let side;
                let distance = 0;
                let tileType = TILE_TYPES.VOID;

                for (let i = 0; i < this.config.maxRenderDistance * 2; i++) {
                    if (sideDistX < sideDistY) {
                        sideDistX += deltaDistX;
                        mapX += stepX;
                        side = 0;
                        distance = sideDistX - deltaDistX;
                    } else {
                        sideDistY += deltaDistY;
                        mapY += stepY;
                        side = 1;
                        distance = sideDistY - deltaDistY;
                    }

                    if (mapX < 0 || mapX >= dungeon.grid[0].length || mapY < 0 || mapY >= dungeon.grid.length) {
                        break;
                    }

                    tileType = dungeon.grid[mapY][mapX];

                    if (tileType === TILE_TYPES.WALL || tileType === TILE_TYPES.DOOR) {
                        hit = true;
                        break;
                    }
                }

                return { hit, distance, side, tileType };
            }

            getWallColor(tileType, brightness) {
                let baseColor;

                switch (tileType) {
                    case TILE_TYPES.WALL:
                        baseColor = [100, 100, 120];
                        break;
                    case TILE_TYPES.DOOR:
                        baseColor = [139, 69, 19];
                        break;
                    default:
                        baseColor = [80, 80, 80];
                }

                const r = Math.floor(baseColor[0] * brightness);
                const g = Math.floor(baseColor[1] * brightness);
                const b = Math.floor(baseColor[2] * brightness);

                return `rgb(${r}, ${g}, ${b})`;
            }

            drawEntities(player, entities) {
                const sortedEntities = entities
                    .map(entity => ({
                        ...entity,
                        distance: Math.hypot(entity.x - player.x, entity.y - player.y),
                        angle: Math.atan2(entity.y - player.y, entity.x - player.x),
                    }))
                    .filter(e => e.distance < this.config.maxRenderDistance)
                    .sort((a, b) => b.distance - a.distance);

                for (const entity of sortedEntities) {
                    let relativeAngle = entity.angle - player.angle;

                    while (relativeAngle > Math.PI) relativeAngle -= 2 * Math.PI;
                    while (relativeAngle < -Math.PI) relativeAngle += 2 * Math.PI;

                    const fovRad = (this.config.fov * Math.PI) / 180;
                    if (Math.abs(relativeAngle) > fovRad / 2) continue;

                    const screenX = (0.5 + relativeAngle / fovRad) * this.canvas.width;
                    const spriteSize = (this.canvas.height / entity.distance) * 0.5;
                    const brightness = Math.max(0, 1 - entity.distance / this.config.maxRenderDistance);

                    this.ctx.font = `${spriteSize}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.globalAlpha = brightness;
                    this.ctx.fillText(entity.sprite || '👾', screenX, this.canvas.height / 2);
                    this.ctx.globalAlpha = 1;
                }
            }
        }

        // ==================== COMPOSANT PRINCIPAL ====================

        function DungeonCrawler() {
            const [gameState, setGameState] = useState('menu'); // menu, charCreation, playing, paused, gameOver, victory
            const [character, setCharacter] = useState(null);
            const [currentDungeon, setCurrentDungeon] = useState(0);
            const [currentLevel, setCurrentLevel] = useState(0);
            const [dungeon, setDungeon] = useState(null);
            const [player, setPlayer] = useState(null);
            const [entities, setEntities] = useState([]);
            const [inventory, setInventory] = useState([]);
            const [equipment, setEquipment] = useState({});
            const [combat, setCombat] = useState(null);
            const [messages, setMessages] = useState([]);
            const [keysPressed, setKeysPressed] = useState({});

            const canvasRef = useRef(null);
            const engineRef = useRef(null);
            const lastUpdateRef = useRef(Date.now());
            const attackCooldownRef = useRef(0);

            // Initialisation du moteur de rendu
            useEffect(() => {
                if (canvasRef.current && gameState === 'playing') {
                    engineRef.current = new RaycastEngine(canvasRef.current, RAYCASTING_CONFIG);
                }
            }, [gameState]);

            // Boucle de jeu
            useEffect(() => {
                if (gameState !== 'playing') return;

                const gameLoop = () => {
                    const now = Date.now();
                    const deltaTime = (now - lastUpdateRef.current) / 1000;
                    lastUpdateRef.current = now;

                    updateGame(deltaTime);
                    renderGame();

                    requestAnimationFrame(gameLoop);
                };

                const animationId = requestAnimationFrame(gameLoop);
                return () => cancelAnimationFrame(animationId);
            }, [gameState, player, entities, dungeon]);

            // Gestion des touches
            useEffect(() => {
                const handleKeyDown = (e) => {
                    setKeysPressed(prev => ({ ...prev, [e.key]: true }));

                    if (e.key === 'Escape') {
                        setGameState(prev => prev === 'playing' ? 'paused' : 'playing');
                    }

                    if (gameState === 'playing' && e.key === ' ') {
                        performAttack();
                    }

                    if (gameState === 'playing' && e.key >= '1' && e.key <= '9') {
                        useQuickSlot(parseInt(e.key) - 1);
                    }
                };

                const handleKeyUp = (e) => {
                    setKeysPressed(prev => ({ ...prev, [e.key]: false }));
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, [gameState, player, combat]);

            const updateGame = (deltaTime) => {
                if (!player || !dungeon) return;

                // Mise à jour du cooldown d'attaque
                if (attackCooldownRef.current > 0) {
                    attackCooldownRef.current -= deltaTime;
                }

                // Déplacement du joueur
                const moveSpeed = 3 * deltaTime;
                const rotateSpeed = 2 * deltaTime;

                let newX = player.x;
                let newY = player.y;
                let newAngle = player.angle;

                if (keysPressed['ArrowLeft'] || keysPressed['q'] || keysPressed['Q']) {
                    newAngle -= rotateSpeed;
                }
                if (keysPressed['ArrowRight'] || keysPressed['d'] || keysPressed['D']) {
                    newAngle += rotateSpeed;
                }

                if (keysPressed['ArrowUp'] || keysPressed['z'] || keysPressed['Z'] || keysPressed['w'] || keysPressed['W']) {
                    newX += Math.cos(player.angle) * moveSpeed;
                    newY += Math.sin(player.angle) * moveSpeed;
                }
                if (keysPressed['ArrowDown'] || keysPressed['s'] || keysPressed['S']) {
                    newX -= Math.cos(player.angle) * moveSpeed;
                    newY -= Math.sin(player.angle) * moveSpeed;
                }

                // Collision
                const mapX = Math.floor(newX);
                const mapY = Math.floor(newY);

                if (mapX >= 0 && mapX < dungeon.grid[0].length &&
                    mapY >= 0 && mapY < dungeon.grid.length &&
                    dungeon.grid[mapY][mapX] === TILE_TYPES.FLOOR) {
                    setPlayer(prev => ({ ...prev, x: newX, y: newY, angle: newAngle }));
                } else {
                    setPlayer(prev => ({ ...prev, angle: newAngle }));
                }

                // Mise à jour des ennemis
                updateEntities(deltaTime);

                // Vérifier si on marche sur les escaliers
                if (dungeon.grid[Math.floor(player.y)][Math.floor(player.x)] === TILE_TYPES.STAIRS_DOWN) {
                    nextLevel();
                }
            };

            const updateEntities = (deltaTime) => {
                setEntities(prevEntities => {
                    return prevEntities.map(entity => {
                        if (!entity.active || entity.hp <= 0) return entity;

                        const dx = player.x - entity.x;
                        const dy = player.y - entity.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        // Si proche du joueur, attaquer
                        if (distance < 1.5) {
                            if (!entity.lastAttack || Date.now() - entity.lastAttack > 1500) {
                                enemyAttack(entity);
                                return { ...entity, lastAttack: Date.now() };
                            }
                        }

                        // Sinon, se déplacer vers le joueur
                        if (distance > 1.5 && distance < 10) {
                            const moveSpeed = (entity.speed || 1) * deltaTime;
                            const newX = entity.x + (dx / distance) * moveSpeed;
                            const newY = entity.y + (dy / distance) * moveSpeed;

                            const mapX = Math.floor(newX);
                            const mapY = Math.floor(newY);

                            if (dungeon.grid[mapY] && dungeon.grid[mapY][mapX] === TILE_TYPES.FLOOR) {
                                return { ...entity, x: newX, y: newY };
                            }
                        }

                        return entity;
                    });
                });
            };

            const enemyAttack = (enemy) => {
                const enemyType = ENEMY_TYPES[enemy.type];
                const damage = enemyType.damage[0] + Math.random() * (enemyType.damage[1] - enemyType.damage[0]);

                setPlayer(prev => {
                    const newHp = Math.max(0, prev.currentHp - Math.floor(damage));
                    if (newHp <= 0) {
                        setGameState('gameOver');
                    }
                    return { ...prev, currentHp: newHp };
                });

                addMessage(`${enemyType.name} inflige ${Math.floor(damage)} dégâts!`, 'damage');
            };

            const performAttack = () => {
                if (attackCooldownRef.current > 0) return;

                const weapon = equipment.mainHand || 'fist';
                const weaponData = WEAPONS[weapon];
                const attackSpeed = weaponData.speed || 1.0;

                attackCooldownRef.current = attackSpeed;

                // Trouver l'ennemi le plus proche devant le joueur
                const attackRange = 2;
                let closestEnemy = null;
                let closestDistance = attackRange;

                entities.forEach((entity, index) => {
                    if (!entity.active || entity.hp <= 0) return;

                    const dx = entity.x - player.x;
                    const dy = entity.y - player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < closestDistance) {
                        const angleToEnemy = Math.atan2(dy, dx);
                        let angleDiff = angleToEnemy - player.angle;
                        while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                        while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

                        if (Math.abs(angleDiff) < Math.PI / 4) {
                            closestEnemy = { entity, index };
                            closestDistance = distance;
                        }
                    }
                });

                if (closestEnemy) {
                    const result = physicalAttack(player, closestEnemy.entity, weapon);

                    if (result.hit) {
                        setEntities(prev => {
                            const newEntities = [...prev];
                            newEntities[closestEnemy.index] = {
                                ...newEntities[closestEnemy.index],
                                hp: Math.max(0, newEntities[closestEnemy.index].hp - result.damage),
                            };

                            if (newEntities[closestEnemy.index].hp <= 0) {
                                const enemyType = ENEMY_TYPES[newEntities[closestEnemy.index].type];
                                gainXp(enemyType.xp);
                                addMessage(`${enemyType.name} vaincu! +${enemyType.xp} XP`, 'success');
                            }

                            return newEntities;
                        });

                        const critMsg = result.critical ? ' CRITIQUE!' : '';
                        addMessage(`Vous infligez ${result.damage} dégâts${critMsg}`, 'attack');
                    } else {
                        addMessage(result.message, 'info');
                    }
                } else {
                    addMessage('Aucune cible à portée', 'info');
                }
            };

            const gainXp = (amount) => {
                setPlayer(prev => {
                    const raceData = RACES[character.race];
                    const xpGain = Math.floor(amount * (raceData.xpBonus || 1));
                    const newXp = prev.xp + xpGain;
                    const xpNeeded = prev.level * 100;

                    if (newXp >= xpNeeded) {
                        levelUp();
                        return { ...prev, xp: newXp - xpNeeded };
                    }

                    return { ...prev, xp: newXp };
                });
            };

            const levelUp = () => {
                setPlayer(prev => {
                    const newLevel = prev.level + 1;
                    const derived = calculateDerivedStats(prev, newLevel, character.class, character.race);

                    addMessage(`NIVEAU ${newLevel} atteint!`, 'success');

                    return {
                        ...prev,
                        level: newLevel,
                        maxHp: derived.maxHp,
                        currentHp: derived.maxHp,
                        maxMana: derived.maxMana,
                        currentMana: derived.maxMana,
                        ...derived,
                    };
                });
            };

            const useQuickSlot = (slot) => {
                // Utiliser un objet de l'inventaire rapide
            };

            const addMessage = (text, type = 'info') => {
                setMessages(prev => [...prev.slice(-4), { text, type, id: Date.now() }]);
            };

            const renderGame = () => {
                if (engineRef.current && player && dungeon) {
                    const activeEntities = entities.filter(e => e.active && e.hp > 0);
                    engineRef.current.render(player, dungeon, activeEntities);
                }
            };

            const startGame = (char) => {
                const derived = calculateDerivedStats(char.attributes, 1, char.class, char.race);

                const newPlayer = {
                    ...char.attributes,
                    level: 1,
                    xp: 0,
                    currentHp: derived.maxHp,
                    currentMana: derived.maxMana,
                    ...derived,
                    x: 5,
                    y: 5,
                    angle: 0,
                };

                setCharacter(char);
                setPlayer(newPlayer);
                generateNewDungeon(0, 0);
                setGameState('playing');
                addMessage('Bienvenue dans les Donjons Maudits!', 'info');
            };

            const generateNewDungeon = (dungeonId, level) => {
                const generator = new DungeonGenerator(40, 40, {});
                const generated = generator.generate();

                setDungeon(generated);
                setPlayer(prev => ({
                    ...prev,
                    x: generated.spawn.x + 0.5,
                    y: generated.spawn.y + 0.5,
                }));

                // Générer des ennemis
                const dungeonData = DUNGEONS[dungeonId];
                const newEntities = [];

                for (let i = 0; i < 10; i++) {
                    const room = generated.rooms[Math.floor(Math.random() * generated.rooms.length)];
                    if (!room) continue;

                    const enemyType = dungeonData.enemyTypes[Math.floor(Math.random() * dungeonData.enemyTypes.length)];
                    const enemyData = ENEMY_TYPES[enemyType];

                    newEntities.push({
                        type: enemyType,
                        x: room.center.x + Math.random() * 2 - 1,
                        y: room.center.y + Math.random() * 2 - 1,
                        hp: enemyData.hp,
                        maxHp: enemyData.hp,
                        sprite: enemyData.sprite,
                        speed: enemyData.speed,
                        active: true,
                    });
                }

                setEntities(newEntities);
                setCurrentDungeon(dungeonId);
                setCurrentLevel(level);
            };

            const nextLevel = () => {
                if (currentLevel < 2) {
                    generateNewDungeon(currentDungeon, currentLevel + 1);
                    addMessage('Vous descendez au niveau suivant...', 'info');
                } else if (currentDungeon < DUNGEONS.length - 1) {
                    generateNewDungeon(currentDungeon + 1, 0);
                    addMessage(`Vous entrez dans ${DUNGEONS[currentDungeon + 1].name}!`, 'info');
                } else {
                    setGameState('victory');
                }
            };

            // ==================== RENDU UI ====================

            if (gameState === 'menu') {
                return (
                    <div className="w-screen h-screen bg-gradient-to-b from-gray-900 via-purple-900 to-black flex items-center justify-center">
                        <div className="text-center">
                            <h1 className="text-6xl font-bold text-yellow-400 mb-8 glow medieval-font">
                                LES DONJONS MAUDITS
                            </h1>
                            <p className="text-xl text-gray-300 mb-12 max-w-2xl mx-auto">
                                Dans un royaume en ruines, d'anciens donjons referment surface,
                                libérant des horreurs oubliées. Explorez 5 donjons maudits,
                                vaincre leurs gardiens, et assembler les fragments d'un artefact légendaire.
                            </p>
                            <button
                                onClick={() => setGameState('charCreation')}
                                className="px-12 py-4 bg-red-700 hover:bg-red-600 text-white text-2xl font-bold rounded-lg transition transform hover:scale-105"
                            >
                                NOUVELLE PARTIE
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState === 'charCreation') {
                return <CharacterCreation onComplete={startGame} onBack={() => setGameState('menu')} />;
            }

            if (gameState === 'gameOver') {
                return (
                    <div className="w-screen h-screen bg-black flex items-center justify-center">
                        <div className="text-center">
                            <h1 className="text-6xl font-bold text-red-600 mb-8 medieval-font">VOUS ÊTES MORT</h1>
                            <p className="text-xl text-gray-400 mb-8">
                                Niveau atteint: {player?.level} | XP: {player?.xp}
                            </p>
                            <button
                                onClick={() => setGameState('menu')}
                                className="px-8 py-3 bg-gray-700 hover:bg-gray-600 text-white text-xl rounded"
                            >
                                Retour au menu
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState === 'victory') {
                return (
                    <div className="w-screen h-screen bg-gradient-to-b from-yellow-900 via-yellow-700 to-yellow-500 flex items-center justify-center">
                        <div className="text-center">
                            <h1 className="text-6xl font-bold text-white mb-8 medieval-font glow">VICTOIRE!</h1>
                            <p className="text-2xl text-gray-900 mb-8">
                                Vous avez vaincu l'Entité du Néant et sauvé le royaume!
                            </p>
                            <p className="text-xl text-gray-800 mb-8">
                                Niveau final: {player?.level} | XP total: {player?.xp}
                            </p>
                            <button
                                onClick={() => setGameState('menu')}
                                className="px-8 py-3 bg-purple-900 hover:bg-purple-800 text-white text-xl rounded"
                            >
                                Retour au menu
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState === 'playing' || gameState === 'paused') {
                return (
                    <div className="w-screen h-screen bg-black flex flex-col">

                        {/* HUD */}
                        <div className="h-48 bg-gray-900 border-t-4 border-yellow-700 p-4">
                            <div className="grid grid-cols-3 gap-4 h-full">
                                {/* Gauche - Stats */}
                                <div className="space-y-2">
                                    <div>
                                        <div className="flex justify-between text-sm text-red-400 mb-1">
                                            <span>VIE</span>
                                            <span>{player?.currentHp}/{player?.maxHp}</span>
                                        </div>
                                        <div className="w-full bg-gray-800 h-4 rounded">
                                            <div
                                                className="bg-red-600 h-full rounded stat-bar"
                                                style={{ width: `${(player?.currentHp / player?.maxHp) * 100}%` }}
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-sm text-blue-400 mb-1">
                                            <span>MANA</span>
                                            <span>{player?.currentMana}/{player?.maxMana}</span>
                                        </div>
                                        <div className="w-full bg-gray-800 h-4 rounded">
                                            <div
                                                className="bg-blue-600 h-full rounded stat-bar"
                                                style={{ width: `${(player?.currentMana / player?.maxMana) * 100}%` }}
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-sm text-yellow-400 mb-1">
                                            <span>XP</span>
                                            <span>{player?.xp}/{player?.level * 100}</span>
                                        </div>
                                        <div className="w-full bg-gray-800 h-4 rounded">
                                            <div
                                                className="bg-yellow-600 h-full rounded stat-bar"
                                                style={{ width: `${(player?.xp / (player?.level * 100)) * 100}%` }}
                                            />
                                        </div>
                                    </div>

                                    <div className="text-sm text-gray-400">
                                        <span>Niveau {player?.level}</span> |
                                        <span className="ml-2">{character?.class && CLASSES[character.class].name}</span>
                                    </div>

                                {/* Centre - Messages */}

                                        <div

                                                msg.type === 'attack' ? 'text-orange-400' :
                                                msg.type === 'success' ? 'text-green-400' :

                                {/* Droite - Info */}
                                <div className="text-right text-sm text-gray-400 space-y-1">
                                    <div className="text-yellow-500 font-bold">
                                        {DUNGEONS[currentDungeon]?.name}
                                    </div>
                                    <div>Niveau {currentLevel + 1}/3</div>
                                    <div>Ennemis: {entities.filter(e => e.hp > 0).length}</div>
                                    <div className="mt-4 text-xs">
                                        <div>ESPACE: Attaquer</div>
                                        <div>Flèches/ZQSD: Déplacer</div>
                                        <div>ESC: Pause</div>
                                    </div>

                        </div>

                        {/* Menu Pause */}
                        {gameState === 'paused' && (
                            <div className="absolute inset-0 bg-black bg-opacity-75 flex items-center justify-center">
                                <div className="bg-gray-800 p-8 rounded-lg">
                                    <h2 className="text-3xl text-yellow-400 mb-6 medieval-font">PAUSE</h2>
                                    <div className="space-y-4">
                                        <button
                                            onClick={() => setGameState('playing')}
                                            className="w-full px-6 py-3 bg-green-700 hover:bg-green-600 text-white rounded"
                                        >
                                            Reprendre
                                        </button>
                                        <button
                                            onClick={() => setGameState('menu')}
                                            className="w-full px-6 py-3 bg-red-700 hover:bg-red-600 text-white rounded"
                                        >
                                            Quitter
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return null;
        }

        // ==================== CRÉATION DE PERSONNAGE ====================

        function CharacterCreation({ onComplete, onBack }) {
            const [step, setStep] = useState(1);
            const [name, setName] = useState('');
            const [race, setRace] = useState('human');
            const [playerClass, setPlayerClass] = useState('warrior');
            const [attributes, setAttributes] = useState({
                str: 10,
                end: 10,
                agi: 10,
                int: 10,
                wis: 10,
                per: 10,
            });
            const [pointsRemaining, setPointsRemaining] = useState(15);

            const adjustAttribute = (attr, delta) => {
                const newValue = attributes[attr] + delta;
                if (newValue < 5 || newValue > 20) return;
                if (delta > 0 && pointsRemaining <= 0) return;

                setAttributes(prev => ({ ...prev, [attr]: newValue }));
                setPointsRemaining(prev => prev - delta);
            };

            const handleComplete = () => {
                if (!name.trim()) {
                    alert('Veuillez entrer un nom');
                    return;
                }

                const raceData = RACES[race];
                const finalAttributes = {
                    str: attributes.str + raceData.bonusStats.str,
                    end: attributes.end + raceData.bonusStats.end,
                    agi: attributes.agi + raceData.bonusStats.agi,
                    int: attributes.int + raceData.bonusStats.int,
                    wis: attributes.wis + raceData.bonusStats.wis,
                    per: attributes.per + raceData.bonusStats.per,
                };

                onComplete({
                    name,
                    race,
                    class: playerClass,
                    attributes: finalAttributes,
                });
            };

            return (
                <div className="w-screen h-screen bg-gradient-to-b from-gray-900 to-black flex items-center justify-center p-8">
                    <div className="bg-gray-800 rounded-lg p-8 max-w-4xl w-full">
                        <h2 className="text-4xl text-yellow-400 mb-8 medieval-font text-center">
                            CRÉATION DE PERSONNAGE
                        </h2>

                        {/* Étape 1: Nom */}
                        {step === 1 && (
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-white mb-2">Nom du personnage</label>
                                    <input
                                        type="text"
                                        value={name}
                                        onChange={(e) => setName(e.target.value)}

                                    />

                                <div className="flex justify-between">
                                    <button onClick={onBack} className="px-6 py-3 bg-gray-600 hover:bg-gray-500 text-white rounded">
                                        Retour

                                    <button onClick={() => setStep(2)} className="px-6 py-3 bg-blue-700 hover:bg-blue-600 text-white rounded">
                                        Suivant
                                    </button>
                                </div>
                            </div>

                        {/* Étape 2: Race */}
                        {step === 2 && (
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-white mb-4 text-xl">Choisissez votre race</label>
                                    <div className="grid grid-cols-2 gap-4">
                                        {Object.entries(RACES).map(([key, data]) => (
                                            <div
                                                key={key}

                                                className={`p-4 rounded cursor-pointer border-2 transition ${
                                                    race === key ? 'border-yellow-400 bg-gray-700' : 'border-gray-600 bg-gray-750 hover:border-gray-500'
                                                }`}
                                            >
                                                <h3 className="text-xl text-yellow-400 mb-2">{data.name}</h3>
                                                <p className="text-sm text-gray-400 mb-2">{data.passive}</p>
                                                <div className="text-xs text-gray-500">
                                                    {Object.entries(data.bonusStats).map(([stat, value]) => (
                                                        value !== 0 && <span key={stat} className="mr-2">{stat.toUpperCase()} {value > 0 ? '+' : ''}{value}</span>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex justify-between">
                                    <button onClick={() => setStep(1)} className="px-6 py-3 bg-gray-600 hover:bg-gray-500 text-white rounded">
                                        Retour
                                    </button>
                                    <button onClick={() => setStep(3)} className="px-6 py-3 bg-blue-700 hover:bg-blue-600 text-white rounded">
                                        Suivant
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Étape 3: Classe */}
                        {step === 3 && (
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-white mb-4 text-xl">Choisissez votre classe</label>
                                    <div className="grid grid-cols-2 gap-4">
                                        {Object.entries(CLASSES).map(([key, data]) => (
                                            <div
                                                key={key}
                                                onClick={() => setPlayerClass(key)}
                                                className={`p-4 rounded cursor-pointer border-2 transition ${
                                                    playerClass === key ? 'border-yellow-400 bg-gray-700' : 'border-gray-600 bg-gray-750 hover:border-gray-500'
                                                }`}
                                            >
                                                <h3 className="text-xl text-yellow-400 mb-2">{data.name}</h3>
                                                <p className="text-sm text-gray-400">
                                                    Stats principales: {data.mainStats.map(s => s.toUpperCase()).join(', ')}
                                                </p>
                                                <p className="text-xs text-gray-500 mt-2">
                                                    HP: +{data.hpBonus} | Mana: +{data.manaBonus}
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex justify-between">
                                    <button onClick={() => setStep(2)} className="px-6 py-3 bg-gray-600 hover:bg-gray-500 text-white rounded">
                                        Retour
                                    </button>
                                    <button onClick={() => setStep(4)} className="px-6 py-3 bg-blue-700 hover:bg-blue-600 text-white rounded">
                                        Suivant
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Étape 4: Attributs */}
                        {step === 4 && (
                            <div className="space-y-6">
                                <div>
                                    <div className="text-white mb-4 text-xl">
                                        Répartir les attributs
                                        <span className="ml-4 text-yellow-400">Points restants: {pointsRemaining}</span>
                                    </div>

                                    <div className="space-y-3">
                                        {Object.entries(attributes).map(([attr, value]) => (
                                            <div key={attr} className="flex items-center justify-between bg-gray-700 p-3 rounded">
                                                <span className="text-white w-32">{attr.toUpperCase()}</span>
                                                <div className="flex items-center gap-4">
                                                    <button
                                                        onClick={() => adjustAttribute(attr, -1)}
                                                        className="px-3 py-1 bg-red-700 hover:bg-red-600 text-white rounded"
                                                        disabled={value <= 5}
                                                    >
                                                        -
                                                    </button>
                                                    <span className="text-white text-xl w-12 text-center">{value}</span>
                                                    <button
                                                        onClick={() => adjustAttribute(attr, 1)}
                                                        className="px-3 py-1 bg-green-700 hover:bg-green-600 text-white rounded"
                                                        disabled={value >= 20 || pointsRemaining <= 0}
                                                    >
                                                        +
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-gray-700 p-4 rounded">
                                    <h3 className="text-yellow-400 mb-2">Récapitulatif</h3>
                                    <p className="text-white">Nom: {name}</p>
                                    <p className="text-white">Race: {RACES[race].name}</p>
                                    <p className="text-white">Classe: {CLASSES[playerClass].name}</p>
                                </div>

                                <div className="flex justify-between">
                                    <button onClick={() => setStep(3)} className="px-6 py-3 bg-gray-600 hover:bg-gray-500 text-white rounded">
                                        Retour
                                    </button>
                                    <button
                                        onClick={handleComplete}
                                        className="px-6 py-3 bg-green-700 hover:bg-green-600 text-white rounded text-xl"
                                    >
                                        COMMENCER L'AVENTURE
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==================== LANCEMENT ====================

        ReactDOM.render(<DungeonCrawler />, document.getElementById('root'));
    </script>
</body>
</html>
